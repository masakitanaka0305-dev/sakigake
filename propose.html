${DIV}

${skillsBullets}

${e.skillSheetUrl}
${DIV}`;
}

  const skillTags = project.skills.map(s => `<span class="mono text-[10px] bg-cream2 text-ink2 px-1.5 py-0.5 rounded font-bold">${esc(s)}</span>`).join('');
  document.getElementById('project-card').innerHTML = `
    <div class="flex items-start gap-3 mb-4">
      <div class="w-12 h-12 rounded-xl bg-cream2 flex items-center justify-center mono text-[12px] font-black flex-shrink-0">${project.logo}</div>
      <div class="flex-1 min-w-0">
        <div class="font-black text-[15px] leading-tight">${esc(project.title)}</div>
        <div class="mono text-[10.5px] text-inksoft mt-1.5 tracking-[0.04em]">${esc(project.client)} · ${esc(project.industry)} · ${project.id}</div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 text-[12px] mb-3">
      <div><span class="mono text-[9px] text-inkmute tracking-[0.14em] uppercase font-bold mr-1">単価</span><b class="num">${project.rate[0]}–${project.rate[1]}万</b></div>
      <div><span class="mono text-[9px] text-inkmute tracking-[0.14em] uppercase font-bold mr-1">期間</span><b class="num">${project.months}ヶ月</b></div>
      <div><span class="mono text-[9px] text-inkmute tracking-[0.14em] uppercase font-bold mr-1">開始</span><b>${project.start.slice(5)}</b></div>
      <div><span class="mono text-[9px] text-inkmute tracking-[0.14em] uppercase font-bold mr-1">ロール</span><b>${esc(project.role)}</b></div>
    </div>
    <div class="flex flex-wrap gap-1.5">${skillTags}</div>
    <a href="project-detail.html?id=${project.id}" class="mt-4 inline-flex items-center gap-1 text-[11px] text-inksoft hover:text-ink font-bold mono tracking-wide">案件詳細を見る →</a>
  `;
}

// ============================================
// Render Engineer Picker
// ============================================
function renderPicker() {
  const sorted = [...engineers].sort((a,b) => b.fit - a.fit);
  document.getElementById('engineer-picker').innerHTML = sorted.map(e => {
    const isSelected = e.id === selectedEng.id;
    return `
    <button type="button" data-eng-id="${e.id}" class="eng-opt text-left rounded-xl border-2 ${isSelected ? 'border-mint bg-mintsoft/30' : 'border-black/5 bg-cream/30 hover:border-black/20'} px-3 py-2.5 transition flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg av-${e.color} flex items-center justify-center mono text-[11px] font-black flex-shrink-0">${e.initial}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="font-black text-[13px] leading-tight">${e.initial} さん</span>
          <span class="mono text-[10px] text-inkmute">${esc(e.id)}</span>
        </div>
        <div class="text-[11px] text-inksoft mt-0.5 leading-tight">${esc(e.techStack.split('、')[0])}</div>
        <div class="num font-bold text-[12px] mt-1">${e.rate}<span class="text-[10px] text-inksoft font-bold ml-0.5">万 / 月</span> <span class="text-[10px] text-inksoft ml-1">稼働: ${esc(e.startable)}</span></div>
      </div>
      <div class="flex-shrink-0 text-center">
        <div class="num font-black text-[16px] ${e.fit >= 90 ? 'text-mintdeep' : e.fit >= 80 ? 'text-info' : 'text-inksoft'} leading-none">${e.fit}</div>
        <div class="mono text-[8px] text-inkmute tracking-[0.14em] mt-0.5 font-bold uppercase">AI</div>
      </div>
      ${isSelected ? '<div class="absolute -mr-1"><svg class="w-4 h-4 text-mintdeep" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>' : ''}
    </button>`;
  }).join('');

  document.querySelectorAll('.eng-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.engId;
      selectedEng = engineers.find(e => e.id === id) || engineers[0];
      renderPicker();
      renderProposal();
    });
  });
}

// ============================================
// Render Proposal textarea
// ============================================
function renderProposal() {
  document.getElementById('proposal').value = buildProposalText(project, selectedEng);
}

document.getElementById('copy-btn').addEventListener('click', () => {
  const text = document.getElementById('proposal').value;
  navigator.clipboard?.writeText(text).catch(()=>{});
  toast(`📋 ${selectedEng.initial} さん × ${project.client} の提案文をコピーしました`);
});

document.getElementById('mark-sent').addEventListener('click', () => {
  toast(`✉ 商談ページに「提案済み」として記録 → 遷移します`);
  setTimeout(() => { location.href = 'deals.html'; }, 1200);
});

// Toast
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.remove('opacity-0','translate-y-5');
  t.classList.add('opacity-100','translate-y-0');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => {
    t.classList.add('opacity-0','translate-y-5');
    t.classList.remove('opacity-100','translate-y-0');
  }, 2400);
}

// Init
renderProject();
renderPicker();
renderProposal();
</script>

</body>
</html>
