  '待機': '営業中', '提案中': '営業中', '書類選考': '営業中',
  '面談調整': '面談依頼', '商談中': '面談実施', '落選': '営業中',
};
function migrateStatus(s) { return STATUS_MIGRATE[s] || (STATUS_OPTIONS.includes(s) ? s : '営業中'); }

// Local persistence — sales-mvp.html と共通キー
const STORAGE_KEY = 'sg_pipeline_status';
function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch(e) { return {}; }
}
function saveOverrides(map) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); } catch(e) {}
}
// 旧キーからの移行
(function migrateOldKey() {
  try {
    const old = JSON.parse(localStorage.getItem('sg_engineer_status')||'{}');
    if (Object.keys(old).length > 0) {
      const cur = loadOverrides();
      Object.entries(old).forEach(([k, v]) => { if (!cur[k]) cur[k] = migrateStatus(v); });
      saveOverrides(cur);
      localStorage.removeItem('sg_engineer_status');
    }
  } catch(e) {}
})();

const statusOverrides = loadOverrides();
engineers.forEach(e => {
  if (statusOverrides[e.id]) {
    e.currentStatus = migrateStatus(statusOverrides[e.id]);
  } else {
    e.currentStatus = migrateStatus(e.currentStatus);
  }
});

${slots}

◼︎アピールポイント
${e.appeal}


${DIV}
要員概要
${DIV}
氏名：${e.initial}（${e.age}歳・${e.gender}）
最寄り駅：${e.station}

並行：${e.parallel}件

言語/FW : ${e.techStack}
工程: ${e.phases}
DB/OS: ${e.dbos}
ツール: ${e.tools}

スキル：
${skillsBullets}

スキルシート：
${e.skillSheetUrl}
${DIV}`;
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function matchesFilter(filter, status) {
  if (filter === 'all') return true;
  if (filter === 'proposing') return status === '営業中';
  if (filter === 'interview') return ['面談依頼','面談設定済み','面談実施'].includes(status);
  if (filter === 'active')    return status === '稼働中';
  return true;
}

function recomputeCounts() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const f = el.dataset.count;
    el.textContent = engineers.filter(e => matchesFilter(f, e.currentStatus)).length;
  });
}

          </div>
          <div class="flex items-baseline gap-x-4 gap-y-1 flex-wrap text-[12px] text-ink2">
            <span><span class="text-inksoft">📍</span> ${e.station}</span>
            <span><span class="text-inksoft">所属</span> <b>${e.affiliation}</b></span>
            <span><span class="text-inksoft">通勤</span> <b>${e.workStyle}</b></span>
          </div>
          <div class="flex items-baseline gap-x-4 gap-y-1 mt-1 flex-wrap text-[12px] text-ink2">
            <span class="email-copy cursor-pointer hover:opacity-80 transition" data-email="${e.email}"><span class="text-inksoft">✉</span> <span class="text-mintdeep">${e.email}</span></span>
            <span><span class="text-inksoft">📞</span> <a href="tel:${e.phone}" class="hover:underline">${e.phone}</a></span>
          </div>
          <div class="flex items-baseline gap-x-4 mt-1.5 flex-wrap">
            <span class="num font-black text-[20px] whitespace-nowrap">${e.rate}<span class="text-[12px] text-inksoft font-bold ml-0.5">万 / 月</span></span>
            <span class="text-[12px] text-inksoft whitespace-nowrap">並行 <b class="text-ink num">${e.parallel}</b>件 · 稼働 <b class="text-ink">${e.startable}</b></span>
            ${isActive && e.monthlyIncome ? `<span class="text-[11px] mono text-mintdeep font-bold">+¥${e.monthlyIncome.toLocaleString()}/月 あなた報酬</span>` : ''}
          </div>
        </div>
        <div class="flex flex-col items-end gap-1.5 flex-shrink-0">
          <div class="relative inline-flex items-center">
            <select class="status-select ${STATUS_BG[e.currentStatus] || 'bg-gray-100 text-gray-600'} text-[11px] font-bold rounded-full pl-3 pr-7 py-1 appearance-none cursor-pointer outline-none border-0 focus:ring-2 focus:ring-ink/20 transition" data-eng-id="${e.id}">
              ${optionsHtml}
            </select>
            <svg class="w-3 h-3 absolute right-2 pointer-events-none ${(STATUS_BG[e.currentStatus] || '').includes('text-mint') ? 'text-mint' : 'opacity-60'}" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
          ${isClosing ? `<a href="closing.html?eng=${e.id}" class="text-[10.5px] mono font-bold text-mintdeep hover:text-ink underline underline-offset-2 whitespace-nowrap">→ バックオフィスに送信</a>` : ''}
        </div>
      </div>

      ${hasAlert ? `
      <div class="bg-warnsoft border-b border-warn/30 px-5 lg:px-6 py-2.5 text-[12px] flex items-center gap-2">
        <span class="text-warn flex-shrink-0">⚠</span>
        <span class="font-bold text-[#B45309]">${e.alert}</span>
      </div>` : ''}

      <!-- Copy-paste preview -->
      <div class="p-5 lg:p-6">
        <div class="flex items-center gap-3 mb-2.5">
          <span class="mono text-[10px] text-inksoft tracking-[0.16em] uppercase font-bold">クライアント送付用テキスト</span>
          <span class="text-[10px] text-inkmute">· 直接編集可能</span>
          <span class="flex-1"></span>
          <button class="copy-btn bg-mint hover:bg-[#5BE890] text-ink px-4 py-2 rounded-lg text-[12px] font-bold flex items-center gap-1.5 whitespace-nowrap transition shadow-[0_2px_8px_rgba(74,222,128,0.25)]" data-paste-idx="${i}">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-2M8 5a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2M8 5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2m0 0h2a2 2 0 0 1 2 2v3m0 4h-6m0 0l2-2m-2 2l2 2"/></svg>
            全文コピー
          </button>
        </div>
        <textarea data-paste-idx="${i}" class="paste-area w-full bg-ink text-mint/95 rounded-xl p-4 mono text-[11.5px] leading-[1.7] whitespace-pre-wrap overflow-x-auto h-[420px] custom-scroll selection:bg-mint/30 outline-none focus:ring-2 focus:ring-mint/40 resize-y" spellcheck="false">${esc(pasteText)}</textarea>
        <div class="mt-2.5 flex items-center gap-2 text-[10.5px] text-inksoft">
          <span class="mono tracking-wide">スキルシート (Google Sheets):</span>
          <a href="${e.skillSheetUrl}" target="_blank" rel="noopener" class="truncate text-mintdeep hover:underline mono">${e.skillSheetUrl.replace('https://','')}</a>
        </div>
      </div>

    </article>`;
  }).join('');

  // Re-bind copy buttons (read current textarea value, including edits)
  grid.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.pasteIdx, 10);
      const e = list[idx];
      const ta = grid.querySelector(`textarea.paste-area[data-paste-idx="${idx}"]`);
      const text = ta ? ta.value : buildPasteText(e);
      navigator.clipboard?.writeText(text).catch(()=>{});
      toast(`📋 ${e.initial} さんの送付用テキストをコピーしました`);
    });
  });

  grid.querySelectorAll('.email-copy').forEach(el => {
    el.addEventListener('click', () => {
      const email = el.dataset.email;
      navigator.clipboard?.writeText(email).catch(()=>{});
      toast(`📋 ${email} をコピーしました`);
    });
  });

  // Status change handler
  grid.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const id = sel.dataset.engId;
      const eng = engineers.find(x => x.id === id);
      if (!eng) return;
      const newStatus = sel.value;
      eng.currentStatus = newStatus;
      const ov = loadOverrides();
      ov[id] = newStatus;
      saveOverrides(ov);
      toast(`✓ ${eng.initial} さん → ${newStatus}`);
      const currentFilter = document.querySelector('.filter-btn.active')?.dataset.filter || 'all';
      render(currentFilter);
      recomputeCounts();
    });
  });
}

// Filter tabs
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active','bg-ink','text-white');
      b.classList.add('text-inksoft','font-medium');
      b.classList.remove('font-bold');
    });
    btn.classList.add('active','bg-ink','text-white','font-bold');
    btn.classList.remove('text-inksoft','font-medium');
    render(btn.dataset.filter);
  });
});

// Toast
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2400);
}

render();
recomputeCounts();
</script>

</body>
</html>
