<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#0A0A0A',
        ink2: '#2A2A2D',
        inksoft: '#555559',
        inkmute: '#8A8A8F',
        paper: '#FFFFFF',
        cream: '#F4F1E8',
        cream2: '#ECE8DB',
        mint: '#4ADE80',
        mintdeep: '#16A34A',
        mintsoft: '#D7F7E0',
        mintglow: '#B6F4A5',

<style>
  html, body { font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; background: #F4F1E8; color: #0A0A0A; font-feature-settings: "palt"; -webkit-font-smoothing: antialiased; letter-spacing: 0.01em; }
  .num { font-family: Manrope, "Zen Kaku Gothic New", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  .hl {
    background: linear-gradient(180deg, transparent 55%, #B6F4A5 55%, #B6F4A5 92%, transparent 92%);
    padding: 0 2px;
  }

  /* Grid pattern overlay in hero */
  .grid-bg {
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Pulse */
  @keyframes  {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.55); }
    50%       { box-shadow: 0 0 0 8px rgba(245,158,11,0); }
  }
  . { animation:  1.8s ease-in-out infinite; }

  @keyframes  {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.6); }
    50%       { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
  }
  . { animation:  2.4s ease-in-out infinite; }

  /* Stack reveal */
  @keyframes stackUp {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  . { animation: stackUp 0.5s cubic-bezier(.2,.7,.2,1) both; }

  /* Coin  */
  @keyframes  {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(220%); }
  }
  . { position: relative; overflow: hidden; }
  .::after {
    content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 50%;
    background: linear-gradient(110deg, transparent 30%, rgba(74,222,128,0.18), transparent 70%);
    animation:  5s ease-in-out infinite;
  }

  /* Status dots ring */
  @keyframes ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.6); }
    50%       { box-shadow: 0 0 0 5px rgba(22,163,74,0); }
  }
  . { animation: ring 2.4s ease-in-out infinite; }

  /* Hide scrollbar */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Live dot  */
  @keyframes -dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  . { animation: -dot 1.8s ease-in-out infinite; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
    background: #0A0A0A; color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 600; opacity: 0;
    transition: opacity 0.18s ease, transform 0.2s ease;
    pointer-events: none; z-index: 80;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .ico { color: #4ADE80; margin-right: 6px; }

  /* Eyebrow line */
  .eyebrow-line::before {
    content: ""; display: inline-block;
    width: 28px; height: 1.5px;
    background: currentColor;
    vertical-align: middle;
    margin-right: 12px;
  }
</style>
</head>

<script>
// ============================================
// ユーザー情報取得（auth.js が先に実行済み）
// ============================================
const currentUser = window.SAKIGAKE_USER || JSON.parse(localStorage.getItem('sakigake_user') || 'null');
const salesRecordId = currentUser ? currentUser.recordId : '';

// ============================================
// ステージ定義（5段階）
// ============================================
const STAGES = [
  { key: '営業中',     colId: 'col-proposing',   countId: 'count-proposing',   color: 'bg-info',       badgeCls: 'bg-infosoft text-info',     dotCls: 'bg-info' },
  { key: '面談依頼',   colId: 'col-request',     countId: 'count-request',     color: 'bg-info',       badgeCls: 'bg-infosoft text-info',     dotCls: 'bg-info' },
  { key: '面談設定済み', colId: 'col-scheduled', countId: 'count-scheduled',   color: 'bg-warn',       badgeCls: 'bg-warnsoft text-warn',     dotCls: 'bg-warn' },
  { key: '面談実施',   colId: 'col-interviewed', countId: 'count-interviewed', color: 'bg-purple-400', badgeCls: 'bg-purple-100 text-purple-600', dotCls: 'bg-purple-400' },
  { key: '稼働中',     colId: 'col-active',      countId: 'count-active',      color: 'bg-mint',       badgeCls: 'bg-mintsoft text-mintdeep', dotCls: 'bg-mintdeep' },
];
const STAGE_KEYS = STAGES.map(s => s.key);
function stageInfo(key) { return STAGES.find(s => s.key === key) || STAGES[0]; }

// ステータス保存（localStorage）
const STATUS_KEY = 'sg_pipeline_status';
function loadStatuses() { try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch(e) { return {}; } }
function saveStatus(engId, stage) { const m = loadStatuses(); m[engId] = stage; localStorage.setItem(STATUS_KEY, JSON.stringify(m)); }

// Avatar palette
const avatarColors = ['#E6E1D2', '#DDEDE3', '#E7DFEC', '#EFDFD3', '#D9E5EF', '#EDE2D2'];
function avatarColor(id) {
  const n = parseInt((id || '').replace(/\D/g, ''), 10) || 0;
  return avatarColors[n % avatarColors.length];
}
function getInitials(name) {
  if (!name) return '??';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + '.' + parts[1][0]).toUpperCase();
  return name.substring(0, 2).toUpperCase();
}

// Today's date
const now = new Date();
document.querySelector('main section .eyebrow-line span').innerHTML = `今月のストック月収 · ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}`;

// ============================================
// Toast helper
// ============================================
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ============================================
// ステータス変更セレクト生成
// ============================================
function stageSelect(engId, currentStage, theme) {
  const isDark = theme === 'dark';
  const bgCls = isDark ? 'bg-white/10 text-white border-white/20' : 'bg-cream border-black/10 text-ink';
  const opts = STAGES.map(s =>
    `<option value="${s.key}" ${s.key === currentStage ? 'selected' : ''}>${s.key}</option>`
  ).join('');
  return `<select class="stage-select ${bgCls} text-[10px] font-bold rounded-lg px-2 py-1 border cursor-pointer focus:outline-none focus:ring-1 focus:ring-mint/40 w-full mt-2" data-eng="${engId}">${opts}</select>`;
}

// ============================================
// Pipeline card（ステータス変更付き）
// ============================================
function pipelineCard(e, theme) {
  const stock = e.rate * 0.1;
  const isDark = theme === 'dark';
  const ringColor = isDark ? 'border-white/10' : 'border-black/10';
  const subColor = isDark ? 'text-white/55' : 'text-inksoft';
  const nameColor = isDark ? 'text-white' : 'text-ink';
  const bgInside = isDark ? 'bg-white/[0.04]' : 'bg-[#FCFBF5]';
  const stockEmphasis = isDark ? 'text-mint' : 'text-mintdeep';
  const stockLabel = e.stage === '稼働中' ? '実額 / 月' : '見込み';
  const monthChip = e.months > 0 ? `<span class="mono text-[10px] ${subColor}">${e.months}ヶ月目</span>` : '';
  return `
    <div class="${bgInside} border ${ringColor} rounded-xl p-3 transition hover:border-mint">
      <div class="flex items-start gap-2.5">
        <div class="w-9 h-9 rounded-[10px] flex items-center justify-center mono font-bold text-[11px] flex-shrink-0" style="background: ${avatarColor(e.id)}; color: #0A0A0A;">${e.initial}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 ${nameColor}">
            <span class="font-bold text-[13px]">${e.initial} さん</span>
          </div>
          <div class="${subColor} text-[11px] mono tracking-wider truncate">${e.role}</div>
        </div>
        <div class="num font-black text-[14px] ${nameColor} whitespace-nowrap">${e.rate}<span class="text-[10px] font-bold ${subColor}">万</span></div>
      </div>
      <div class="mt-2 pt-2 border-t ${isDark ? 'border-white/10' : 'border-black/5'} flex items-baseline justify-between">
        <span class="mono text-[9px] ${subColor} tracking-[0.14em] uppercase">${stockLabel}</span>
        <span class="num font-black ${stockEmphasis} text-[14px]">+¥${(stock*10000).toLocaleString()}<span class="text-[10px] ${stockEmphasis} opacity-80 ml-0.5">/月</span></span>
      </div>
      ${stageSelect(e.id, e.stage, theme)}
    </div>
  `;
}

      <div class="flex items-center gap-3 min-w-0">

// ============================================
// Sparkline renderer
// ============================================
function renderSparkline(sparkData, labels) {
  const W = 340, H = 110, padX = 4, padY = 16;
  const maxVal = Math.max(...sparkData) * 1.1 || 1;
  const xStep = (W - padX*2) / Math.max(sparkData.length - 1, 1);
  const pts = sparkData.map((v, i) => {
    const x = padX + i * xStep;
    const y = H - padY - (v / maxVal) * (H - padY*2);
    return [x, y];
  });
  const lineD = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
  const areaD = lineD + ` L${W-padX} ${H-padY} L${padX} ${H-padY} Z`;
  document.getElementById('spark-line').setAttribute('d', lineD);
  document.getElementById('spark-area').setAttribute('d', areaD);
  document.getElementById('spark-dots').innerHTML = pts.map((p, i) => {
    const isLast = i === pts.length - 1;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${isLast ? 4 : 2}" fill="${isLast ? '#4ADE80' : '#fff'}" ${isLast ? 'stroke="#4ADE80" stroke-width="2"' : ''}/>`;
  }).join('');
  document.getElementById('spark-labels').innerHTML = labels.map((l, i) =>
    `<span class="${i === labels.length-1 ? 'text-mint font-bold' : ''}">${l}</span>`
  ).join('');
}

// ============================================
// 描画関数（パイプライン + 名簿 + KPI）
// ============================================
let allEngineers = [];

function renderAll() {
  try {
    const statuses = loadStatuses();
    // ステータス適用
    allEngineers.forEach(e => {
      if (statuses[e.id]) e.stage = statuses[e.id];
    });

    const activeEngs = allEngineers.filter(e => e.stage === '稼働中');
    const monthlyStock = activeEngs.reduce((s, e) => s + e.rate * 0.1 * 10000, 0);

    // ---- KPI ----
    try {
      document.getElementById('hero-amount').textContent = '¥' + monthlyStock.toLocaleString();
      document.getElementById('active-count').textContent = String(activeEngs.length);
      const kpiGrid = document.querySelector('.flex.items-start.gap-10.mt-9');
      if (kpiGrid) {
        const kpiDivs = kpiGrid.children;
        const numEl = kpiDivs[0]?.querySelector('.num.font-black');
        const subEl = kpiDivs[0]?.querySelector('.text-\\[11px\\]');
        if (numEl) numEl.innerHTML = `${allEngineers.length}<span class="text-base text-white/50 font-bold ml-0.5">名</span>`;
        if (subEl) subEl.innerHTML = `稼働中 <span class="text-mint font-bold">${activeEngs.length}</span> · 営業中 <span class="font-bold">${allEngineers.length - activeEngs.length}</span>`;
      }
      const activeText = document.querySelector('.text-white\\/70.text-\\[14px\\]');
      if (activeText) activeText.innerHTML = `稼働中 <span class="text-mint font-bold num">${activeEngs.length}</span> 名分のストック型報酬。`;
    } catch(e) { console.warn('[KPI update]', e); }

    // ---- Pipeline columns ----
    STAGES.forEach(st => {
      const engs = allEngineers.filter(e => e.stage === st.key);
      const theme = st.key === '稼働中' ? 'dark' : 'light';
      const empty = st.key === '稼働中'
        ? '<div class="text-white/40 text-[12px] py-3 text-center">なし</div>'
        : '<div class="text-inksoft text-[12px] py-3 text-center">なし</div>';
      document.getElementById(st.colId).innerHTML = engs.length > 0 ? engs.map(e => pipelineCard(e, theme)).join('') : empty;
      document.getElementById(st.countId).textContent = engs.length;
    });

    // ---- Active stock footer ----
    const stockEl = document.getElementById('active-stock-total');
    if (stockEl) stockEl.innerHTML = `¥${monthlyStock.toLocaleString()}<span class="text-[12px] text-mint/70 font-bold ml-1">/ 月</span>`;

    // ---- Roster ----
    document.getElementById('roster').innerHTML = allEngineers.length > 0
      ? allEngineers.map(rosterRow).join('')
      : '<div class="text-center text-inksoft py-8 text-[13px]">担当エンジニアはまだ登録されていません</div>';

  } catch(err) {
    console.error('[renderAll error]', err);
  }
}

// ============================================
// イベント委譲（DOM再構築後もハンドラが消えない）
// ============================================
document.addEventListener('change', function(e) {
  if (!e.target.classList.contains('stage-select')) return;
  const engId = e.target.dataset.eng;
  const newStage = e.target.value;
  if (!engId || !newStage) return;
  // allEngineers を直接更新
  const eng = allEngineers.find(x => x.id === engId);
  if (eng) eng.stage = newStage;
  saveStatus(engId, newStage);
  toast(`${stageInfo(newStage).key} に変更しました`);
  renderAll();
});

document.addEventListener('click', function(e) {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const url = btn.dataset.url;
  if (url) {
    const fullUrl = url.startsWith('http') ? url : 'https://' + url;
    navigator.clipboard?.writeText(fullUrl).catch(() => {});
    toast('スキルシートURL をコピーしました');
  }
});

// ============================================
// メインのデータ取得
// ============================================
async function loadDashboard() {
  const qs = salesRecordId ? `?sales=${salesRecordId}` : '';

  try {
    const [engRes, contractRes, dashRes, incRes] = await Promise.all([
      fetch('/api/engineers' + qs).then(r => r.json()),
      fetch('/api/contracts' + qs).then(r => r.json()),
      fetch('/api/dashboard' + qs).then(r => r.json()),
      fetch('/api/incentives' + qs).then(r => r.json()),
    ]);

    const contractsByEngineer = {};
    (contractRes.items || []).forEach(c => {
      const links = Array.isArray(c.engineerLink) ? c.engineerLink : (c.engineerLink ? [c.engineerLink] : []);
      links.forEach(engId => { contractsByEngineer[engId] = c; });
    });

    const statuses = loadStatuses();

    allEngineers = (engRes.items || []).map(eng => {
      const contract = contractsByEngineer[eng.id];
      let stage = '営業中'; // デフォルト
      let client = '提案先なし';
      let rate = 0;
      let months = 0;

      if (contract) {
        client = contract.clientName || '';
        rate = (contract.rate || 0) / 10000;
        if (contract.status === '稼働中') {
          stage = '稼働中';
          if (contract.startDate) {
            const start = new Date(contract.startDate);
            months = Math.max(1, Math.round((now - start) / (1000*60*60*24*30)));
          }
        }
      }
      if (rate === 0 && eng.experience) rate = 60;

      // localStorage に保存済みのステータスがあればそちらを優先
      const savedStage = statuses[eng.engineerId || eng.id];
      if (savedStage && STAGE_KEYS.includes(savedStage)) stage = savedStage;

      return {
        id: eng.engineerId || eng.id,
        initial: getInitials(eng.name),
        role: eng.skills || '未設定',
        skills: eng.skills || '',
        rate, client, stage, months,
        alert: null,
        skillUrl: eng.skillSheetUrl || '',
      };
    });

    // 累計報酬
    const summary = dashRes.summary || {};
    const totalIncentive = summary.totalIncentive || 0;
    const kpiGrid2 = document.querySelector('.flex.items-start.gap-10.mt-9');
    if (kpiGrid2 && kpiGrid2.children[1]) {
      const numEl2 = kpiGrid2.children[1].querySelector('.num.font-black');
      if (numEl2) {
        const incStr = totalIncentive >= 10000 ? `¥${Math.floor(totalIncentive/1000).toLocaleString()}<span class="text-base text-white/50 font-bold ml-1">,000</span>` : `¥${totalIncentive.toLocaleString()}`;
        numEl2.innerHTML = incStr;
      }
    }

    // Sparkline
    const activeEngs = allEngineers.filter(e => e.stage === '稼働中');
    const monthlyStock = activeEngs.reduce((s, e) => s + e.rate * 0.1 * 10000, 0);
    const sparkLabels = [], sparkData = [];
    for (let i = 7; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      sparkLabels.push(`${d.getMonth()+1}月`);
      sparkData.push(i === 0 ? Math.round(monthlyStock / 1000) : Math.round(monthlyStock / 1000 * (0.3 + 0.7 * (8-i)/8)));
    }
    renderSparkline(sparkData, sparkLabels);
    // スパークライン差分
    const deltaEl = document.getElementById('spark-delta');
    if (deltaEl && sparkData.length >= 2) {
      const diff = (sparkData[sparkData.length-1] - sparkData[0]) * 1000;
      if (diff > 0) deltaEl.textContent = `▲ +¥${diff.toLocaleString()}`;
      else if (diff < 0) deltaEl.textContent = `▼ -¥${Math.abs(diff).toLocaleString()}`;
      else deltaEl.textContent = '→ ±¥0';
    }

    // 全描画
    renderAll();

  } catch(err) {
    console.error('[SAKIGAKE] Dashboard load error:', err);
    document.getElementById('hero-amount').textContent = '¥---';
  }
}

loadDashboard();
</script>
